<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f58220">

  <meta charset="UTF-8">
  <title>Bus Tracker | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <img src="logo.png" class="logo">

    <div class="lang-buttons">
      <button type="button" onclick="setLang('en')">English</button>
      <button type="button" onclick="setLang('ar')">Arabic</button>
    </div>

    <h1 data-en="Bus Tracker" data-ar="تتبع الحافلة">Bus Tracker</h1>

    <p data-en="School Transportation System" data-ar="نظام نقل المدرسة">
      School Transportation System
    </p>

    <!-- FIXED: moved inside sidebar -->
    <div class="how-we-work">
      <h3 data-en="How we work?" data-ar="كيف نعمل؟">How we work?</h3>
      <p
        data-en="Parents and students log in securely, select their assigned bus, and track its live location in real time for a safer and more reliable school commute."
        data-ar="يقوم أولياء الأمور والطلاب بتسجيل الدخول بشكل آمن، اختيار الحافلة المخصصة لهم، ومتابعة موقعها المباشر لضمان رحلة مدرسية أكثر أمانًا.">
       Parents and students log in securely, select their assigned bus, and track its live location in real time for a safer and more reliable school commute.

      </p>
    </div>
  </aside>

  <main class="main">
    <div class="card">
      <h2 data-en="Login" data-ar="تسجيل الدخول">Login</h2>

      <p id="error" class="error"></p>

      <input
        id="loginPhone"
        placeholder="Phone number"
        data-en-placeholder="Phone number"
        data-ar-placeholder="رقم الهاتف">

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        data-en-placeholder="Password"
        data-ar-placeholder="كلمة المرور">

      <button type="button" onclick="login()" data-en="Login" data-ar="دخول">
        Login
      </button>

      <p class="link">
        <span data-en="No account?" data-ar="لا يوجد حساب؟">No account?</span>
        <a href="create.html" data-en="Create one" data-ar="إنشاء حساب">Create one</a>
      </p>
    </div>
  </main>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="script.js"></script>
<script>

if ("serviceWorker" in navigator) {
navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
